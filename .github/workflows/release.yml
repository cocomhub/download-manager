# Release workflow — 制品构建与发布。
# - push tags v*.*.*：手动打 tag 或 release-please 创建 tag 后触发。
# - workflow_call：release-please.yml 在创建 tag 后显式调用（GITHUB_TOKEN 创建的
#   tag 不会触发 push 型 workflow）。
# - workflow_dispatch：手动补发指定 tag。

name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_call:
    inputs:
      tag:
        description: "要发布的 tag（release-please 的 tag_name）。为空时回落到触发 ref。"
        required: false
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag（如 v0.1.0）"
        required: true
        type: string

permissions:
  contents: write
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    name: GoReleaser + Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      # workflow_call / workflow_dispatch 必须显式给 tag。
      - name: Validate tag input
        if: github.event_name != 'push'
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [ -z "$TAG" ]; then
            echo "::error::inputs.tag 为空：workflow_call/workflow_dispatch 必须显式传入 tag"
            exit 1
          fi

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          check-latest: true

      - name: Run tests
        run: make test

      # 显式解析 previous tag（根 tag 链）：GoReleaser 的 getTag 3 级优先级中，
      # `git describe --tags --abbrev=0` 可能被嵌套 module tag（cmd/playwright-server/v*）
      # 污染。--match 'v[0-9]*' 从根源上只认根 tag。
      - name: Resolve previous tag
        id: prevtag
        run: |
          CUR="${{ inputs.tag || github.ref_name }}"
          PREV=$(git describe --tags --abbrev=0 --match 'v[0-9]*' "tags/${CUR}^" 2>/dev/null || echo "")
          echo "prev=$PREV"
          echo "previous=$PREV" >> "$GITHUB_OUTPUT"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 显式注入 current/previous tag，绕过 git describe 的嵌套 tag 污染。
          GORELEASER_CURRENT_TAG: ${{ inputs.tag || github.ref_name }}
          GORELEASER_PREVIOUS_TAG: ${{ steps.prevtag.outputs.previous }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository }}:${{ inputs.tag || github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
