server:
  http_port: 8080
  ui_only_port: 8091
  work_dir: ./build/test
  lock_file: ./build/test/download-manager.lock
  ui_defaults:
    default_save_dir: ./downloads
    window_width: 1200
    window_height: 800
    diff_side_by_side: false
    diff_ignore_ws: false
    diff_ignore_comment: false
    status_style: overlay
runtime:
  mode: ui
log:
  level: debug
  filename: ./build/test/logs/app.log
  max_size: 10
  max_backups: 3
  max_age: 28
  console: true
  compress: true
mongo:
  - name: suixi-mini
    uri: mongodb://root:root123@suixi-mini.local:27017/download_manager?authSource=admin
downloader:
  type: native
  global_concurrent: 1
  max_retries: 3
  log_dir: ./build/test/logs/downloader
  force_proxy: false
  proxies:
    - http://129.226.212.209:18080
    - http://43.159.49.114:18080
  # 新配置结构（可选，未设置时按默认值与兼容逻辑工作）：
  # filesystem:
  #   root_dir: ./build/test/downloads     # 若未设置，默认 <server.work_dir>/downloads
  #   log_dir: logs                        # 相对 root_dir，默认 "logs"
  #   cache_dir: .cache                    # 相对 root_dir，默认 ".cache"
  # http:
  #   timeout_seconds: 600
  #   idle_conn_timeout_seconds: 30
  #   max_idle_conns: 100
  #   max_idle_conns_per_host: 10
  #   default_user_agent: ""               # 为空则使用内置 UA
  #   disable_inject_browser_like_headers: false
  # proxy:
  #   force: false
  #   list:
  #     - http://127.0.0.1:7890
  #   decision_cache_ttl_secs: 1
  #   direct_probe_timeout_secs: 3
  #   bandwidth_path_suffix: /bandwidth
  # progress:
  #   min_percent_step: 0.5
  #   max_interval_seconds: 10
  # ffmpeg:
  #   path: ffmpeg
  #   extra_args: []
  #   resolution_crf:
  #     720: 40
  #     1080: 34
  #   default_crf: 33
  #   move_if_exists:
  #     enabled: false
  #   external_hls_log:
  #     enabled: false
  #   hls_auto_mark_as_fail: false
  # sproxy_cloud（配了 api_url 即启用云端下载后端；下载项级 cloud_download 决定哪些对象走它）：
  #   通用：任意 URL 都可交 sproxy（其 downloaderFor 按 URL 自动发现后端）；
  #   PikPak 分享链接（keepshare/mypikpak）为特化优先来源。
  #   api_url: http://127.0.0.1:8080/api/cloud/download   # 必填（不配则拒绝投递）
  #   access_key: ""                  # SproxySig AccessKey
  #   access_key_secret: ""           # SproxySig AccessKeySecret（仅本地签名，永不上线）
  #   access_key_id: ""               # SproxySig skey-id（v2 必传）；三件套需同时配置
  #   api_token: ""                   # 旧 Bearer token（未配 SproxySig 时使用）
  #   transfer_volume: ""             # 转存目标卷（留空 = 仅留 cloud 桶）
  #   transfer_path: ""               # 转存目标路径（可含子目录，如 xxx/xxxx.mp4）
  #   cloud_only: false               # false（默认）= 下载到本地 SavePath；true = 仅留云端不下载
  #   poll_every: 5s
  #   timeout: 3h
  #   client_timeout: 0               # 0 = 沿用 sproxy 默认（300s）
task_scan:
  disable: false
  interval: 10
tasks:
  - id: task-file-001
    type: url_list
    save_dir: ./build/test/downloads/task1
    storage:
      type: file
      config:
        path: ./build/test/downloads/task1/status.json
        save_interval: "2"
    extra:
      urls:
        - https://www.baidu.com/robots.txt
        - https://www.bing.com/robots.txt
  - id: task-mongo-001
    type: url_list
    save_dir: ./build/test/downloads/task2
    storage:
      type: mongo
      config:
        collection: task_mongo_001
        database: download_manager
        source: suixi-mini
    extra:
      urls:
        - https://www.bing.com/robots.txt
  - id: task-booksite-001
    type: booksite
    save_dir: ./build/test/downloads/booksite
    storage:
      type: file
      config:
        path: ./build/test/downloads/booksite/status.json
        save_interval: "2"
    extra:
      max_concurrent: 1
